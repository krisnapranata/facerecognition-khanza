# Lokasi bersama SIMRS Face Recognition (di-include oleh server nginx akses LAN).
# Harus sama perilakunya dengan facerec-behind-proxy.conf.template.

location /static/ {
    root /;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
}

# Frame kamera USB -> container vision (nama container unik, bukan "vision").
location /api/face/v1/stations/ {
    set $upstream_vision http://facerec_vision:8001;
    proxy_pass $upstream_vision;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
}

location = /stream/ {
    set $upstream_web http://facerec_web:8000;
    proxy_pass $upstream_web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 1h;
}

location / {
    set $upstream_web http://facerec_web:8000;
    proxy_pass $upstream_web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 30s;
    proxy_read_timeout 120s;
}
